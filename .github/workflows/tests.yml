name: tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from pyproject.toml
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev --python "$(command -v python)"
      # Runners are slower than the one-core reference machine and the budget is enforced locally (21.8 s measured).
      - name: Fast suite
        env:
          REFEREE_SKIP_TIME_BUDGET: "1"
        run: uv run --python "$(command -v python)" pytest -m "not slow"
